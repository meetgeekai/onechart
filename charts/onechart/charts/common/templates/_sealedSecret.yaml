{{- define "common.sealedSecret.tpl" -}}
  {{- if .Values.sealedSecrets }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ template "common.robustName" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
    {{- /* Applied, and unsealed (Argo waits for it to be healthy), before a migrationJob with
    hook: Sync runs at wave -1. Only then: every other release keeps the default wave. */}}
    {{- /* Nested, not one `and`: older Helm builds evaluate every operand of `and`, and
    .Values.migrationJob.enabled errors when migrationJob is unset. */}}
    {{- with .Values.migrationJob }}
    {{- if and .enabled (eq (.hook | default "PreSync") "Sync") }}
    argocd.argoproj.io/sync-wave: "-2"
    {{- end }}
    {{- end }}
spec:
  encryptedData:
  {{- range $key, $val := .Values.sealedSecrets }}
    {{ $key }}: {{ $val | quote }}
  {{- end }}
  template:
    metadata:
      name: {{ template "common.robustName" .Release.Name }}
      namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}
