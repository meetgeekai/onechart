image:
  repository: nginx
  tag: "latest"
  pullPolicy: IfNotPresent

# ingress:
#   host: chart-example.local
#   ingressClassName: nginx
#   tlsEnabled: true
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-staging
#   nginxBasicAuth:
#     user: admin
#     password: secret

# vars:
#   MY_VAR: "value"

# replicas: 69

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 999

securityContext: {}

containerPort: 80

# resources:
#   requests:
#     cpu: "200m"
#     memory: "200Mi"
#   limits:
#     cpu: "200m"
#     memory: "200Mi"

nodeSelector: {}

tolerations: []

probe:
  enabled: false
  path: "/"
  # port: 9000  # serve probes off the app port; defaults to containerPort
  settings:
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

# Before you use a liveness probe: https://srcco.de/posts/kubernetes-liveness-probes-are-dangerous.html
livenessProbe:
  enabled: false
  path: "/"
  # port: 9000  # defaults to containerPort
  settings:
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

# Holds liveness and readiness off until the app has started, so a slow start
# is not killed by the liveness probe. Budget: periodSeconds x failureThreshold.
startupProbe:
  enabled: false
  path: "/"
  # port: 9000  # defaults to containerPort
  settings:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 15

secretEnabled: false

shell: "/bin/sh"

podDisruptionBudgetEnabled: true
spreadAcrossNodes: false

nodePortEnabled: false

# Set true to enable service monitor.
monitor:
  enabled: false

container: {}
podSpec: {}

