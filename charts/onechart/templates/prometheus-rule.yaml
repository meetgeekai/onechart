{{- if .Values.prometheusRules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ template "robustName" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
    {{- with .Values.prometheusLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ template "robustName" .Release.Name }}
      rules:
        {{- range $rule := .Values.prometheusRules }}
        - alert: {{ $rule.name }}
          expr: {{ $rule.expression | quote }}
          {{- with $rule.for }}
          for: {{ . | quote }}
          {{- end }}
          {{- with $rule.labels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          annotations:
            {{- with $rule.message }}
            message: {{ . | quote }}
            {{- end }}
            {{- with $rule.runBookURL }}
            runbook_url: {{ . | quote }}
            {{- end }}
            {{- range $key, $value := $rule.annotations }}
            {{ $key }}: {{ $value | quote }}
            {{- end }}
        {{- end }}
{{- end }}
