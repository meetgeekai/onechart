apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "robustName" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
  annotations:
    kubectl.kubernetes.io/default-container: {{ template "robustName" .Release.Name }}
    {{- if .Values.gitSha }}
    gimlet.io/git-sha: {{ .Values.gitSha }}
    {{- end }}
spec:
  {{- if .Values.replicas }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm-chart.selectorLabels" . | nindent 6 }}
      {{- if .Values.selector }}
        {{- with .Values.selector.matchLabels }}
        {{- toYaml . | nindent 6 }}
        {{- end }}
      {{- end }}
  {{- /* hasKey, not default: default treats an explicit 0 as unset and would turn maxSurge 0 into 1 */}}
  {{- $rs := default dict .Values.rolloutStrategy }}
  strategy:
  {{- if eq (get $rs "type" | default "RollingUpdate") "Recreate" }}
    type: Recreate
  {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ hasKey $rs "maxUnavailable" | ternary (get $rs "maxUnavailable") 0 }}
      maxSurge: {{ hasKey $rs "maxSurge" | ternary (get $rs "maxSurge") 1 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.gitSha }}
        gimlet.io/git-sha: {{ .Values.gitSha }}
        {{- end }}
        {{- if .Values.gitRepository }}
        gimlet.io/git-repository: {{ .Values.gitRepository }}
        {{- end }}
      labels:
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "helm-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- $podSpecTpl := include "common.podSpec.tpl" . | fromYaml }}
      {{- $podSpec := mergeOverwrite $podSpecTpl .Values.podSpec }}
      {{- toYaml $podSpec | nindent 6 }}
